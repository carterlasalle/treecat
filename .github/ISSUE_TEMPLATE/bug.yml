name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `treecat version`
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and terminal
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and reproduction
      description: Remove secrets and private file contents before posting.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
