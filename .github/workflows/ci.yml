name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify module graph
        run: |
          go mod verify
          go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      - name: Enforce coverage floor
        shell: bash
        run: |
          set -euo pipefail
          coverage="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          echo "Total coverage: ${coverage}%"
          awk -v coverage="$coverage" 'BEGIN { if (coverage + 0 < 50.0) exit 1 }'

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          file: coverage.out
        continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Run govulncheck
        run: govulncheck ./...

  build-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-platform build smoke test
        run: go build ./cmd/treecat

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check goreleaser config
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.17.0
          args: check

      - name: Build snapshot release artifacts
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --snapshot --clean --skip=publish

      - name: Verify generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/checksums.txt
          test -n "$(ls dist/*.tar.gz)"
          test -n "$(ls dist/*.zip)"
          test -n "$(ls dist/*.deb)"
          test -n "$(ls dist/*.rpm)"
          test -n "$(ls dist/*.apk)"
          (cd dist && sha256sum --check checksums.txt)

      - name: Smoke test packaged Linux binary
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/treecat-smoke
          mkdir -p /tmp/treecat-smoke
          tar -xzf dist/treecat_linux_amd64.tar.gz -C /tmp/treecat-smoke
          /tmp/treecat-smoke/treecat version
          /tmp/treecat-smoke/treecat completion bash >/dev/null
          /tmp/treecat-smoke/treecat man >/dev/null

      - name: Smoke test Windows ZIP contents
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/treecat-windows
          mkdir -p /tmp/treecat-windows
          unzip -q dist/treecat_windows_amd64.zip -d /tmp/treecat-windows
          test -f /tmp/treecat-windows/treecat.exe
          test -f /tmp/treecat-windows/README.md
          test -f /tmp/treecat-windows/LICENSE
